:root {

  --azure: #2455F5;

  --azure-50: #eef3ff;
  --violet: #F7DCFF;
  --violet-50: #fff8ff;
  --ink: #111827;
  --ink-2: #334155;
  --muted: #667085;
  --soft: #f7f8fc;
  --surface: #ffffff;
  --surface-2: #fbfbfd;
  --line: #e7e9f1;
  --line-2: #d9dce8;

}

* { box-sizing: border-box; }
html, body { margin: 0; min-width: 320px; min-height: 100%; background: #fff; color: var(--ink); }
body { min-height: 100dvh; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }

::selection { background: var(--violet); color: var(--ink); }

.visually-hidden { position: fixed !important; width: 1px !important; height: 1px !important; opacity: 0 !important; pointer-events: none !important; }

.boot-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; transition: opacity .34s ease, visibility .34s ease; }

.logo-lockup { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font-weight: 800; letter-spacing: -.6px; font-size: 19px; }
.logo-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--azure); position: relative; flex: 0 0 auto; box-shadow: 0 9px 20px rgba(36,85,245,.15); overflow: hidden; }
.logo-mark.large { width: 68px; height: 68px; border-radius: 21px; }

.logo-mark i { position: absolute; left: 18px; top: 12px; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 7px solid #fff; }
.logo-mark.large::before { left: 15px; top: 15px; width: 30px; height: 30px; border-width: 8px; border-right: 0; border-radius: 8px 0 0 8px; }
.logo-mark.large span { left: 35px; top: 17px; width: 17px; height: 8px; }
.logo-mark.large i { left: 39px; top: 26px; border-top-width: 8px; border-bottom-width: 8px; border-left-width: 13px; }

.icon-btn, .text-btn, .primary-btn, .secondary-btn, .danger-btn, .chip, .tool-btn, .nav-btn, .sheet-action, .media-action, .timeline-clip, .project-card { cursor: pointer; transition: background .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease, color .16s ease; }
.icon-btn { width: 44px; height: 44px; border-radius: 13px; background: transparent; color: var(--ink-2); display: inline-grid; place-items: center; font-size: 19px; }
.icon-btn:hover { background: var(--soft); }

.text-btn:hover { background: var(--soft); }
.primary-btn { min-height: 48px; border-radius: 14px; background: var(--azure); color: #fff; padding: 0 18px; font-weight: 780; box-shadow: 0 10px 24px rgba(36,85,245,.18); display: inline-flex; align-items: center; justify-content: center; gap: 9px; }
.primary-btn:hover { background: var(--azure-600); transform: translateY(-1px); }

.secondary-btn { min-height: 48px; border-radius: 14px; padding: 0 16px; background: #fff; color: var(--ink); border: 1px solid var(--line-2); font-weight: 750; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.secondary-btn:hover { background: var(--soft); }
.danger-btn { min-height: 44px; border-radius: 13px; padding: 0 14px; color: var(--danger); background: #fff7f8; border: 1px solid #f7d8de; font-weight: 750; }

.app-page { min-height: 100dvh; background: #fff; }
.mobile-header { position: sticky; top: 0; z-index: 60; height: calc(64px + var(--safe-top)); padding: var(--safe-top) max(14px, var(--safe-right)) 0 max(14px, var(--safe-left)); display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,.94); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(231,233,241,.82); }
.header-actions { display: flex; align-items: center; gap: 3px; }

.home-main { width: min(1080px, 100%); margin: 0 auto; padding: 20px 16px calc(96px + var(--safe-bottom)); }
.home-intro { padding: 14px 2px 18px; }

.home-intro h1 { margin: 0; max-width: 720px; font-size: clamp(31px, 8.8vw, 58px); line-height: .98; letter-spacing: -1.9px; font-weight: 860; }

.create-card { margin-top: 12px; border: 1px solid var(--line); border-radius: 22px; background: linear-gradient(145deg, #fff 50%, #fff9ff); padding: 17px; box-shadow: var(--shadow); }
.create-card-top { display: flex; align-items: flex-start; gap: 12px; }
.create-badge { width: 46px; height: 46px; border-radius: 15px; background: var(--azure-50); color: var(--azure); display: grid; place-items: center; font-size: 23px; flex: 0 0 auto; }
.create-card h2 { margin: 1px 0 4px; font-size: 17px; letter-spacing: -.4px; }

.create-actions { margin-top: 16px; display: grid; grid-template-columns: 1fr; gap: 9px; }

.template-scroller { display: flex; gap: 9px; overflow-x: auto; scrollbar-width: none; padding: 2px 1px 5px; }
.template-scroller::-webkit-scrollbar { display: none; }
.template-card { min-width: 126px; border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 13px; text-align: left; color: var(--ink); }
.template-card:hover { border-color: #cdd5ff; background: #fbfcff; }
.template-shape { height: 72px; display: grid; place-items: center; margin-bottom: 10px; }
.template-shape i { display: block; background: linear-gradient(145deg, var(--azure), #607dff); border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.24); }
.template-shape .r169 { width: 84px; height: 47px; }
.template-shape .r916 { width: 39px; height: 69px; }
.template-shape .r11 { width: 58px; height: 58px; }
.template-shape .r45 { width: 50px; height: 63px; }
.template-card strong { display: block; font-size: 13px; }
.template-card span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }

.home-section { margin-top: 28px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.section-head h2 { margin: 0; font-size: 19px; letter-spacing: -.5px; }
.section-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.project-list { display: grid; gap: 10px; }
.project-card { width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 17px; padding: 10px; display: grid; grid-template-columns: 90px minmax(0,1fr) 44px; align-items: center; gap: 12px; }
.project-card:hover { border-color: #d2d8ed; box-shadow: 0 8px 24px rgba(36,85,245,.06); }
.project-thumb { height: 64px; border-radius: 12px; background: linear-gradient(145deg, var(--azure-50), #fff4ff); border: 1px solid #e6eaff; display: grid; place-items: center; color: var(--azure); font-size: 20px; position: relative; overflow: hidden; }
.project-thumb::after { content: ""; width: 36px; height: 36px; border-radius: 50%; background: var(--violet); filter: blur(18px); position: absolute; right: -8px; bottom: -10px; opacity: .8; }
.project-copy { min-width: 0; }
.project-copy strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.project-copy span { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
.project-more { width: 42px; height: 42px; border-radius: 12px; background: var(--soft); color: var(--muted); display: grid; place-items: center; }
.empty-state { border: 1px dashed var(--line-2); border-radius: 18px; padding: 28px 18px; text-align: center; color: var(--muted); background: #fcfcfe; }
.empty-state b { display: block; color: var(--ink); margin-bottom: 5px; }

.trust-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.trust-card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; background: #fff; }
.trust-icon { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--violet-50); color: #8e57a4; font-size: 18px; }
.trust-card strong { display: block; font-size: 13px; }
.trust-card span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }

.mobile-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 65; height: calc(68px + var(--safe-bottom)); padding: 7px max(10px, var(--safe-right)) var(--safe-bottom) max(10px, var(--safe-left)); background: rgba(255,255,255,.96); backdrop-filter: blur(18px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4,1fr); gap: 3px; }
.nav-btn { min-height: 54px; border-radius: 14px; background: transparent; color: #7a8498; display: grid; place-items: center; align-content: center; gap: 3px; font-size: 10px; font-weight: 750; }
.nav-btn .nav-icon { font-size: 19px; line-height: 1; }
.nav-btn.active { color: var(--azure); background: var(--azure-50); }
.nav-btn.create-nav { background: var(--azure); color: #fff; margin: 0 3px; box-shadow: 0 8px 20px rgba(36,85,245,.2); }

/* Editor */
.editor-page { min-height: 100dvh; height: 100dvh; overflow: hidden; background: #fff; display: grid; grid-template-rows: auto minmax(0,1fr) auto; }
.editor-header { height: calc(58px + var(--safe-top)); padding: var(--safe-top) max(10px, var(--safe-right)) 0 max(10px, var(--safe-left)); display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); z-index: 30; }
.editor-title-wrap { min-width: 0; text-align: center; }
.editor-title { width: 100%; border: 0; background: transparent; text-align: center; font-weight: 800; color: var(--ink); padding: 8px 6px; border-radius: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.editor-title:focus { background: var(--soft); }
.editor-header-actions { display: flex; align-items: center; gap: 3px; }

.editor-save-state { display: none; color: var(--muted); font-size: 10px; }

.editor-body { min-height: 0; overflow: hidden; display: grid; grid-template-rows: minmax(220px, 46vh) 54px minmax(122px,1fr); background: #f8f9fc; }
.preview-zone { min-height: 0; position: relative; display: grid; place-items: center; padding: 12px; overflow: hidden; background: #f5f6fa; }
.preview-wrap { max-width: 100%; max-height: 100%; display: grid; place-items: center; }
.preview-frame { position: relative; display: grid; place-items: center; overflow: hidden; background: #0b0d12; border-radius: 11px; box-shadow: 0 14px 34px rgba(23,31,57,.14); }
.preview-frame canvas { width: 100%; height: 100%; display: block; }
.preview-empty { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 8px; color: #919aab; text-align: center; font-size: 12px; padding: 20px; }
.preview-empty strong { color: #5f6878; }
.preview-overlay-badge { position: absolute; left: 10px; top: 10px; padding: 6px 9px; border-radius: 999px; background: rgba(255,255,255,.86); backdrop-filter: blur(10px); color: var(--ink-2); font-size: 9px; font-weight: 800; box-shadow: 0 3px 10px rgba(0,0,0,.08); }

.transport { display: grid; grid-template-columns: 44px 44px minmax(0,1fr) auto; align-items: center; gap: 4px; padding: 0 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff; }
.transport .icon-btn { width: 40px; height: 40px; }
.seekbar { width: 100%; accent-color: var(--azure); }
.timecode { min-width: 76px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; text-align: right; }

.timeline-panel { min-height: 0; overflow: hidden; background: #fff; display: grid; grid-template-rows: 34px minmax(0,1fr); }
.timeline-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line); }
.timeline-toolbar-left, .timeline-toolbar-right { display: flex; align-items: center; gap: 4px; }
.timeline-toolbar button { height: 28px; min-width: 32px; border-radius: 9px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; }
.timeline-toolbar button:hover { background: var(--soft); color: var(--ink); }
.timeline-scroll { position: relative; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; padding: 12px 10px 14px; }
.timeline-ruler { height: 18px; position: relative; color: #9ba3b2; font-size: 9px; white-space: nowrap; }
.timeline-ruler span { position: absolute; transform: translateX(-50%); }
.timeline-track { height: 70px; position: relative; display: flex; align-items: stretch; gap: 4px; min-width: 100%; }
.timeline-clip { flex: 0 0 auto; min-width: 64px; border-radius: 10px; border: 2px solid transparent; background: var(--azure-50); color: var(--ink); padding: 7px; text-align: left; display: grid; align-content: space-between; overflow: hidden; position: relative; }
.timeline-clip.image { background: #fff4fd; }
.timeline-clip.selected { border-color: var(--azure); box-shadow: 0 0 0 2px rgba(36,85,245,.12); }
.timeline-clip strong { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timeline-clip small { font-size: 8px; color: var(--muted); }

.timeline-text { position: absolute; height: 28px; border-radius: 8px; background: var(--violet); border: 1px solid #e5bdf0; color: #6c3b7c; padding: 5px 7px; font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.timeline-text.selected { box-shadow: 0 0 0 2px rgba(36,85,245,.2); border-color: var(--azure); }

.tool-btn.active { background: var(--azure-50); color: var(--azure); }
.tool-btn:hover { background: var(--soft); }

.sheet-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(17,24,39,.16); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.bottom-sheet { position: fixed; z-index: 90; left: 0; right: 0; bottom: 0; max-height: min(74dvh, 650px); background: #fff; border-radius: 24px 24px 0 0; box-shadow: 0 -18px 60px rgba(34,42,76,.15); transform: translateY(105%); transition: transform .24s cubic-bezier(.2,.8,.2,1); padding-bottom: var(--safe-bottom); overflow: hidden; }

.sheet-head strong { font-size: 15px; }
.sheet-close { width: 38px; height: 38px; border-radius: 12px; background: var(--soft); color: var(--ink-2); font-size: 18px; }

.panel-grid { display: grid; gap: 12px; }

.switch-row { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  .hub-thumb { width:44px; height:44px; border-radius:11px; background:#eef3ff; color:#2455F5; display:grid; place-items:center; }
  .hub-project strong,.hub-project small { display:block; }
  .hub-project strong { font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hub-project small { margin-top:4px; color:var(--muted); font-size:9px; }
  .hub-footer { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
}

@media (max-width:420px) {
  .editor-body { grid-template-rows:minmax(150px,1fr) 44px 122px; }
  .tool-btn { flex-basis:68px; }
  .motion-grid,.adjust-grid,.transition-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
  .adjust-tile,.motion-card { min-height:58px; }
  .bottom-sheet { max-height:min(45dvh,400px); }
}

@media (max-width:360px) {
  .editor-header { grid-template-columns:40px minmax(0,1fr) 40px; padding-left:4px; padding-right:4px; }
  .editor-title { font-size:12px; }
  .tool-btn { flex-basis:64px; font-size:8px; }
  .adjust-grid,.motion-grid,.transition-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .timecode { display:none; }
  .transport { grid-template-columns:34px 40px minmax(0,1fr); }
}

@media (min-width:1100px) {
  .landing-header { display:block; }
  .editor-body { grid-template-columns:260px minmax(520px,1fr) 300px; grid-template-rows:minmax(0,1fr) 238px; }
  .desktop-sidebar,.desktop-inspector { padding:16px; }
  .preview-zone { padding:22px 22px 70px; }
  .timeline-panel { grid-row:2; }
  .timeline-clip-wrap { position:relative; flex:0 0 auto; height:70px; }
  .timeline-clip { width:100%; height:70px; }
  .timeline-transition { position:absolute; right:-9px; top:25px; z-index:5; width:20px; height:20px; border-radius:6px; border:1px solid var(--line-2); background:#fff; color:var(--muted); }
  .timeline-transition.active { background:#2455F5; color:#fff; border-color:#2455F5; }
  .desktop-clip-stack { display:grid; gap:12px; }
  .desktop-clip-stack .mobile-quick-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .desktop-clip-stack .preset-carousel { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .desktop-clip-stack .preset-card { min-width:0; }
  .desktop-clip-stack .motion-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .desktop-clip-stack .transition-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .project-hub-backdrop { display:none; }
}

@media (min-width:1440px) {
  .editor-body { grid-template-columns:290px minmax(680px,1fr) 330px; }
  .landing-main,.landing-header-inner { width:min(1280px,calc(100% - 64px)); }
}

@media (min-width:1900px) {

function exportFilename() { const name = (state.project?.name || 'Edituno').replace(/[^a-z0-9\-_ ]/gi, '').trim().replace(/\s+/g, '-') || 'Edituno'; return `${name}.${state.exportResult?.extension || 'webm'}`; }

            obj[clipKey] = val;
            if (clipKey === 'start')
                obj.start = Math.min(obj.start, obj.end - .05);

                obj.end = Math.max(obj.end, obj.start + .05);

            if (textKey === 'weight')
                val = +val;
            const obj = state.project.texts.find(x => x.id === t.id);
            obj[textKey] = val;
            if (textKey === 'start')
                obj.start = Math.max(0, Math.min(obj.start, obj.end - .05));
