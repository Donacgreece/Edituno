name: Deploy Edituno to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build production bundle
        run: npm run build

      - name: Verify Edituno Studio production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-512.png
          test -f dist/og/edituno-share.png
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/llms.txt
          grep -Fq "maximum-scale=1" dist/index.html
          grep -Fq "user-scalable=no" dist/index.html
          grep -Fq "timeline-audio" dist/index.html
          grep -Fq "desktop-tool-menu" dist/index.html
          grep -Fq "application/ld+json" dist/index.html
          grep -Fq "https://edituno.com/" dist/index.html
          grep -Fq "https://edituno.com/og/edituno-share.png" dist/index.html
          grep -Fq "twitter:card" dist/index.html
          grep -Fq "og:image" dist/index.html
          grep -Fq "SoftwareApplication" dist/index.html
          grep -Fq "4K · 2160p" dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
