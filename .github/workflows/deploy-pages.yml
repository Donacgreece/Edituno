name: Deploy Edituno to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Edituno Studio v2 production bundle
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-512.png
          test -f src/app.ts

          grep -Fq "maximum-scale=1" dist/index.html
          grep -Fq "user-scalable=no" dist/index.html
          grep -Fq "timeline-audio" dist/index.html
          grep -Fq "audioClipPanel" dist/index.html
          grep -Fq "scheduleAudioTracks" dist/index.html
          grep -Fq "studio-home" dist/index.html
          grep -Fq "home-rail" dist/index.html
          grep -Fq "studio-project-grid" dist/index.html
          grep -Fq "editor-topbar" dist/index.html
          grep -Fq "asset-browser" dist/index.html
          grep -Fq "inspector-panel" dist/index.html
          grep -Fq "mobile-tool-dock" dist/index.html
          grep -Fq "preview-interaction-layer" dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
