name: Deploy Edituno to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Verify pinned editing engines
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const checks = [
            ['smartcrop', '2.0.5', 'node_modules/smartcrop/smartcrop.js'],
            ['meyda', '5.6.3', 'node_modules/meyda/dist/web/meyda.min.js'],
            ['konva', '10.5.0', 'node_modules/konva/konva.min.js'],
            ['mp4-muxer', '5.2.2', 'node_modules/mp4-muxer/build/mp4-muxer.js'],
            ['mp4box', '2.4.1', 'node_modules/mp4box/dist/mp4box.all.mjs'],
            ['mediabunny', '1.56.2', 'node_modules/mediabunny/dist/bundles/mediabunny.min.cjs'],
          ];
          for (const [name, expected, file] of checks) {
            const meta = JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, 'utf8'));
            if (meta.version !== expected) throw new Error(`${name}: expected ${expected}, got ${meta.version}`);
            if (!fs.existsSync(file) || fs.statSync(file).size <= 0) throw new Error(`${name}: browser bundle missing or empty`);
            console.log(`${name} ${expected}: OK`);
          }
          NODE

      - name: Resolve active Pages domain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          DEFAULT_URL="https://${OWNER}.github.io/${REPO}/"
          CNAME="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // empty' 2>/dev/null || true)"
          if [ -n "$CNAME" ]; then
            SITE_URL="https://${CNAME%/}/"
          else
            SITE_URL="$DEFAULT_URL"
          fi
          echo "EDITUNO_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "Active Edituno site URL: $SITE_URL"

      - name: Fetch pinned GPU browser bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/vendor

          curl -L --fail --retry 4 --retry-all-errors \
            -o public/vendor/pixi.min.js \
            "https://github.com/pixijs/pixijs/releases/download/v8.20.1/pixi.min.js"

          echo "9948591083793305468d73915a3ea85032dcf8e32eee7a1328585050d7a14d53  public/vendor/pixi.min.js" | sha256sum -c -

          curl -L --fail --retry 4 --retry-all-errors \
            -o public/vendor/pixi-filters.min.js \
            "https://github.com/pixijs/filters/releases/download/v6.1.5/pixi-filters.js"

          echo "f47c352255a82a6da287024987d0b254fa1fdc0e8ddfd7fe4652a9b25a703a2c  public/vendor/pixi-filters.min.js" | sha256sum -c -

          test "$(wc -c < public/vendor/pixi.min.js)" -gt 500000
          test "$(wc -c < public/vendor/pixi-filters.min.js)" -gt 100000
          echo "Pinned GPU browser bundles verified."

      - name: Restore pinned LibAV audio runtime cache
        id: libav-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/libav-edituno-audio
          key: libav-audio-v4-6.10.9.0-ffmpeg9.0-emscripten6.0.5-${{ runner.os }}

      - name: Setup pinned Emscripten for LibAV
        if: steps.libav-cache.outputs.cache-hit != 'true'
        uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e # v15
        with:
          version: 6.0.5
          actions-cache-folder: emsdk-cache

      - name: Build or restore LGPL LibAV audio runtime
        shell: bash
        env:
          EDITUNO_LIBAV_CACHE_DIR: ${{ github.workspace }}/.cache/libav-edituno-audio
        run: |
          set -euo pipefail
          bash tools/build-libav-audio.sh
          test -s public/vendor/libav/libav-6.10.9.0-edituno-audio-cli.js
          test -s public/vendor/libav/libav-6.10.9.0-edituno-audio-cli.wasm.js
          test -s public/vendor/libav/libav-6.10.9.0-edituno-audio-cli.wasm.wasm
          test -s public/third-party-source/libavjs-6.10.9.0-edituno-audio-source.tar.xz
          test -s public/third-party-source/mediabunny-1.56.2-source.tar.gz
          tar -tJf public/third-party-source/libavjs-6.10.9.0-edituno-audio-source.tar.xz | grep -F 'ffmpeg-9.0.tar.xz' > /dev/null
          tar -tJf public/third-party-source/libavjs-6.10.9.0-edituno-audio-source.tar.xz | grep -F 'emfiberthreads-' > /dev/null
          tar -tzf public/third-party-source/mediabunny-1.56.2-source.tar.gz | grep -F 'mediabunny-v1.56.2/' > /dev/null

      - name: Build production bundle
        run: npm run build

      - name: Verify domain-aware SEO bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./package.json').version")"
          SHARE_URL="${EDITUNO_SITE_URL}og/edituno-share.png"
          SITEMAP_URL="${EDITUNO_SITE_URL}sitemap.xml"
          echo "Verifying Edituno v${APP_VERSION} production bundle"
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-512.png
          test -f dist/og/edituno-share.png
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/llms.txt
          test -f dist/LICENSE.md
          test -f dist/LICENSE_SCOPE.md
          test -f dist/NOTICE
          test -f dist/THIRD_PARTY_NOTICES.md
          test -f dist/vendor/pixi.min.js
          test -f dist/vendor/pixi-filters.min.js
          test -f dist/vendor/smartcrop.js
          test -f dist/vendor/meyda.min.js
          test -f dist/vendor/konva.min.js
          test -f dist/vendor/mp4-muxer.js
          test -f dist/vendor/mp4box.all.mjs
          test -f dist/vendor/mediabunny.min.cjs
          test -f dist/vendor/libav/libav-6.10.9.0-edituno-audio-cli.js
          test -f dist/vendor/libav/libav-6.10.9.0-edituno-audio-cli.wasm.js
          test -f dist/vendor/libav/libav-6.10.9.0-edituno-audio-cli.wasm.wasm
          test -f dist/third-party-source/libavjs-6.10.9.0-edituno-audio-source.tar.xz
          test -f dist/third-party-source/mediabunny-1.56.2-source.tar.gz
          test -f dist/THIRD_PARTY_SOURCE_OFFER.md
          test -f dist/PATENT_NOTICE.md
          test -f dist/LEGAL_COMPLIANCE_LIBAV_AUDIO.md
          test -f dist/LIBAV_RUNTIME_REPLACEMENT.md
          test -f dist/vendor/gl-transitions/CrossZoom.glsl
          test -f dist/vendor/gl-transitions/Swirl.glsl
          test -f dist/vendor/gl-transitions/AdvancedMosaic.glsl
          test -f dist/vendor/gl-transitions/CircleCrop.glsl
          test -f dist/vendor/gl-transitions/Directional.glsl
          test -f dist/vendor/gl-transitions/Dreamy.glsl
          test -f dist/THIRD_PARTY_LICENSES/PIXIJS-MIT.txt
          test -f dist/THIRD_PARTY_LICENSES/PIXI-FILTERS-MIT.txt
          test -f dist/THIRD_PARTY_LICENSES/GL-TRANSITIONS-MIT.txt
          test -f dist/THIRD_PARTY_LICENSES/SMARTCROP-MIT.txt
          test -f dist/THIRD_PARTY_LICENSES/MEYDA-MIT.txt
          test -f dist/THIRD_PARTY_LICENSES/KONVA-MIT.txt
          test -f dist/THIRD_PARTY_LICENSES/MP4-MUXER-MIT.txt
          test -f dist/THIRD_PARTY_LICENSES/MP4BOX-BSD-3-CLAUSE.txt
          test -f dist/THIRD_PARTY_LICENSES/MEDIABUNNY-MPL-2.0.txt
          test -f dist/THIRD_PARTY_LICENSES/FFMPEG-LGPL-2.1.txt
          test -f dist/THIRD_PARTY_LICENSES/LIBAVJS-LGPL-2.1.txt
          test -f dist/THIRD_PARTY_LICENSES/LIBAVJS-0BSD.txt
          test -f dist/THIRD_PARTY_LICENSES/EMFIBERTHREADS-0BSD.txt
          test $(wc -c < dist/vendor/pixi.min.js) -gt 500000
          test $(wc -c < dist/vendor/pixi-filters.min.js) -gt 100000
          test -s dist/vendor/smartcrop.js
          test -s dist/vendor/meyda.min.js
          test -s dist/vendor/konva.min.js
          test -s dist/vendor/mp4-muxer.js
          test -s dist/vendor/mp4box.all.mjs
          test -s dist/vendor/mediabunny.min.cjs
          test -s dist/vendor/libav/libav-6.10.9.0-edituno-audio-cli.js
          test -s dist/vendor/libav/libav-6.10.9.0-edituno-audio-cli.wasm.js
          test -s dist/vendor/libav/libav-6.10.9.0-edituno-audio-cli.wasm.wasm
          test -s dist/third-party-source/libavjs-6.10.9.0-edituno-audio-source.tar.xz
          test -s dist/third-party-source/mediabunny-1.56.2-source.tar.gz
          grep -Fq 'vendor/smartcrop.js' dist/index.html
          grep -Fq 'vendor/meyda.min.js' dist/index.html
          grep -Fq 'vendor/konva.min.js' dist/index.html
          grep -Fq 'vendor/mp4-muxer.js' dist/index.html
          grep -Fq 'mp4box.all.mjs' dist/index.html
          grep -Fq 'vendor/mediabunny.min.cjs' dist/index.html
          grep -Fq 'edituno-audio-cli' dist/index.html
          grep -Fq 'function loadEditunoLibavAudioFrontend()' dist/index.html
          grep -Fq 'EDITUNO_LIBAV_BASE' dist/LIBAV_RUNTIME_REPLACEMENT.md
          grep -Fq 'function exportProjectSafariLibavAudio(' dist/index.html
          grep -Fq 'function mixProjectAudioWithLibav(' dist/index.html
          grep -Fq 'libav-ffmpeg-wasm' dist/index.html
          grep -Fq 'libav.js v6.10.9.0' dist/THIRD_PARTY_SOURCE_OFFER.md
          grep -Fqi 'patent' dist/PATENT_NOTICE.md
          grep -Fq '## libav.js / FFmpeg WASM audio engine' dist/THIRD_PARTY_NOTICES.md
          grep -Fq 'function exportProjectAppleMediabunny(' dist/index.html
          grep -Fq 'function exportProjectWebCodecs(' dist/index.html
          grep -Fq 'function renderOfflineProjectAudio(' dist/index.html
          grep -Fq 'data-konva-direct-manipulation="true"' dist/index.html
          grep -Fq 'function bindKonvaCanvasEditor()' dist/index.html
          grep -Fq 'new Konva.Transformer' dist/index.html
          grep -Fq 'smartcrop-2.0.5' dist/index.html
          grep -Fq 'meyda-5.6.3' dist/index.html
          grep -Fq 'data-action="smart-reframe"' dist/index.html
          grep -Fq 'data-action="smart-cut-beats"' dist/index.html
          grep -Fq "$EDITUNO_SITE_URL" dist/index.html
          grep -Fq "$SHARE_URL" dist/index.html
          grep -Fq "$SITEMAP_URL" dist/robots.txt
          grep -Fq "<loc>${EDITUNO_SITE_URL}</loc>" dist/sitemap.xml
          grep -Fq "$EDITUNO_SITE_URL" dist/llms.txt
          grep -Fq "application/ld+json" dist/index.html
          grep -Fq "twitter:card" dist/index.html
          grep -Fq "og:image" dist/index.html
          grep -Fq "SoftwareApplication" dist/index.html
          grep -Fq "4K · 2160p" dist/index.html
          grep -Fq 'data-action="set-theme"' dist/index.html
          grep -Fq 'html[data-theme="light"]' dist/index.html
          grep -Fq 'prefers-color-scheme: light' dist/index.html
          grep -Fq 'data-key="autoSave"' dist/index.html
          grep -Fq 'theme-option-check' dist/index.html
          grep -Fq 'PolyForm-Noncommercial-1.0.0' dist/LICENSE.md
          grep -Fq 'Required Notice:' dist/NOTICE
          grep -Fq 'third-party' dist/LICENSE_SCOPE.md
          grep -Fq "edituno-studio-v${APP_VERSION}" dist/sw.js
          grep -Fq "app=${APP_VERSION}" dist/manifest.webmanifest
          if grep -R -Fq "__EDITUNO_SITE_URL__" dist; then exit 1; fi
          if grep -R -Fq "__EDITUNO_SHARE_URL__" dist; then exit 1; fi

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload production site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
