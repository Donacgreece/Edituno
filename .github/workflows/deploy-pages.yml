name: Deploy Edituno to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Resolve active Pages domain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          DEFAULT_URL="https://${OWNER}.github.io/${REPO}/"
          CNAME="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // empty' 2>/dev/null || true)"
          if [ -n "$CNAME" ]; then
            SITE_URL="https://${CNAME%/}/"
          else
            SITE_URL="$DEFAULT_URL"
          fi
          echo "EDITUNO_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "Active Edituno site URL: $SITE_URL"

      - name: Fetch pinned GPU browser bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/vendor

          curl -L --fail --retry 4 --retry-all-errors \
            -o public/vendor/pixi.min.js \
            "https://github.com/pixijs/pixijs/releases/download/v8.20.1/pixi.min.js"

          echo "9948591083793305468d73915a3ea85032dcf8e32eee7a1328585050d7a14d53  public/vendor/pixi.min.js" | sha256sum -c -

          curl -L --fail --retry 4 --retry-all-errors \
            -o public/vendor/pixi-filters.min.js \
            "https://github.com/pixijs/filters/releases/download/v6.1.5/pixi-filters.js"

          echo "f47c352255a82a6da287024987d0b254fa1fdc0e8ddfd7fe4652a9b25a703a2c  public/vendor/pixi-filters.min.js" | sha256sum -c -

          test "$(wc -c < public/vendor/pixi.min.js)" -gt 500000
          test "$(wc -c < public/vendor/pixi-filters.min.js)" -gt 100000
          echo "Pinned GPU browser bundles verified."

      - name: Build production bundle
        run: npm run build

      - name: Verify domain-aware SEO bundle
        shell: bash
        run: |
          set -euo pipefail
          SHARE_URL="${EDITUNO_SITE_URL}og/edituno-share.png"
          SITEMAP_URL="${EDITUNO_SITE_URL}sitemap.xml"
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-512.png
          test -f dist/og/edituno-share.png
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/llms.txt
          test -f dist/LICENSE.md
          test -f dist/LICENSE_SCOPE.md
          test -f dist/NOTICE
          test -f dist/THIRD_PARTY_NOTICES.md
          test -f dist/vendor/pixi.min.js
          test -f dist/vendor/pixi-filters.min.js
          test -f dist/vendor/gl-transitions/CrossZoom.glsl
          test -f dist/vendor/gl-transitions/Swirl.glsl
          test -f dist/vendor/gl-transitions/AdvancedMosaic.glsl
          test -f dist/vendor/gl-transitions/CircleCrop.glsl
          test -f dist/vendor/gl-transitions/Directional.glsl
          test -f dist/vendor/gl-transitions/Dreamy.glsl
          test -f dist/THIRD_PARTY_LICENSES/PIXIJS-MIT.txt
          test -f dist/THIRD_PARTY_LICENSES/PIXI-FILTERS-MIT.txt
          test -f dist/THIRD_PARTY_LICENSES/GL-TRANSITIONS-MIT.txt
          test $(wc -c < dist/vendor/pixi.min.js) -gt 500000
          test $(wc -c < dist/vendor/pixi-filters.min.js) -gt 100000
          grep -Fq "$EDITUNO_SITE_URL" dist/index.html
          grep -Fq "$SHARE_URL" dist/index.html
          grep -Fq "$SITEMAP_URL" dist/robots.txt
          grep -Fq "<loc>${EDITUNO_SITE_URL}</loc>" dist/sitemap.xml
          grep -Fq "$EDITUNO_SITE_URL" dist/llms.txt
          grep -Fq "application/ld+json" dist/index.html
          grep -Fq "twitter:card" dist/index.html
          grep -Fq "og:image" dist/index.html
          grep -Fq "SoftwareApplication" dist/index.html
          grep -Fq "4K · 2160p" dist/index.html
          grep -Fq 'data-action="set-theme"' dist/index.html
          grep -Fq 'html[data-theme="light"]' dist/index.html
          grep -Fq 'prefers-color-scheme: light' dist/index.html
          grep -Fq 'data-key="autoSave"' dist/index.html
          grep -Fq 'theme-option-check' dist/index.html
          grep -Fq 'PolyForm-Noncommercial-1.0.0' dist/LICENSE.md
          grep -Fq 'Required Notice:' dist/NOTICE
          grep -Fq 'third-party' dist/LICENSE_SCOPE.md
          grep -Fq 'edituno-studio-v2.3.1' dist/sw.js
          if grep -R -Fq "__EDITUNO_SITE_URL__" dist; then exit 1; fi
          if grep -R -Fq "__EDITUNO_SHARE_URL__" dist; then exit 1; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
