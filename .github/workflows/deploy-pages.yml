name: Deploy Edituno to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Edituno Studio production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-512.png
          test -f src/app.ts
          grep -Fq "maximum-scale=1" dist/index.html
          grep -Fq "user-scalable=no" dist/index.html
          grep -Fq "timeline-audio" dist/index.html
          grep -Fq "studio-home" dist/index.html
          grep -Fq "editor-topbar" dist/index.html
          grep -Fq "mobile-tool-dock" dist/index.html
          grep -Fq "project-action-sheet" dist/index.html
          grep -Fq "confirm-dialog" dist/index.html
          grep -Fq "preferredAudioInsertTime" dist/index.html
          grep -Fq "mediaImportContext" dist/index.html
          grep -Fq "mobile-app-shell" dist/index.html
          grep -Fq "normalizeViewportAfterKeyboard" dist/index.html
          grep -Fq "lastStableHeight" dist/index.html
          grep -Fq "scrollbar-thumb" dist/index.html
          grep -Fq "timeline-overlay-row" dist/index.html
          grep -Fq "canvas-ratio-grid" dist/index.html
          grep -Fq "transition-card" dist/index.html
          grep -Fq "preset-card" dist/index.html
          grep -Fq "element-library" dist/index.html
          grep -Fq "function addAssetToOverlay" dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
